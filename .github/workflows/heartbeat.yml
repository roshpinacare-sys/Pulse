name: heartbeat
# Pulse — the fleet's autonomous heartbeat (public runner shell, PUBLISH-POLICY §7).
# Public repositories get UNLIMITED free Actions minutes: this organ can pulse forever
# at zero cost, with zero dependency on any sandbox or agent session.
# Loop discipline: observe (live API census) → act (write state) → record (git commit)
# → verify (the commit itself is the observable gate) → terminal states in state/terminal.

# CLOCK REDUNDANCY (DECISIONS #9): three independent clocks, one SLA (state freshness 90min):
#   1. schedule cron — best-effort, may lag on new repos, needs no credentials
#   2. self-relay — every successful run sleeps to the next half-hour boundary and
#      dispatches the next tick (github.token with actions:write; FLEET_TOKEN fallback).
#      The organ carries its own clock: survives with zero sandbox and zero sessions.
#   3. manual/repository_dispatch ignition — humans, agents, or sibling organs
# Fail-closed law: relay fires ONLY on success (probe crash = no chain = named failure),
#   degraded keeps the chain alive (the state commit is the receipt, probe exit 0).

on:
  schedule:
    - cron: '*/30 * * * *' # every 30 min; GitHub may delay under load — the state file records reality
  workflow_dispatch:
    inputs:
      note:
        description: 'optional note recorded into state (max 200 chars)'
        required: false
        default: ''
  repository_dispatch:
    types: [pulse, task]

permissions:
  contents: write
  issues: write
  actions: write # powers the self-relay dispatch (POST /repos/{repo}/dispatches)

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # relay sleeps up to 30 min before self-kick; public-repo minutes are free
    steps:
      - uses: actions/checkout@v4

      - name: probe (observe → act → record)
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }} # fallback PAT — census ladder: FLEET_TOKEN → GH_PAT → tokenless public
          GITHUB_TOKEN: ${{ github.token }} # powers the fail-closed alert-issue law (POST/close)
          TRIGGER: ${{ github.event_name }}
          NOTE: ${{ github.event.inputs.note || github.event.client_payload.note || '' }}
        run: node scripts/probe.mjs

      - name: record (commit the receipt)
        run: |
          git config user.name "pulse-heartbeat"
          git config user.email "pulse-heartbeat@users.noreply.github.com"
          git add state/ mirror/
          if git diff --cached --quiet; then
            echo "no state change — clean no-op (named terminal: no-op)"
          else
            git commit -m "pulse: $(date -u +'%Y-%m-%dT%H:%M:%SZ') [skip ci]"
            # rebase discipline x3: sibling runs and agents push to main concurrently — a push
            # race is transport, never a fleet verdict; measured 2026-10-12 run#4 died exactly here
            for i in 1 2 3; do
              if git push origin HEAD:main; then echo "push OK (attempt $i)"; break; fi
              echo "push attempt $i rejected — rebase discipline onto origin/main"
              git fetch origin
              git rebase -Xtheirs origin/main || git rebase --abort
              if [ "$i" = "3" ]; then echo "named terminal: push-race-unresolved after 3 attempts"; exit 1; fi
            done
          fi

      - name: relay (self-kick the next tick — the organ carries its own clock)
        if: success()
        env:
          FLEET_TOKEN: ${{ secrets.FLEET_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          now=$(date +%s)
          next=$(( (now / 1800 + 1) * 1800 ))
          wait=$(( next - now ))
          [ "$wait" -gt 0 ] || wait=60
          echo "relay: sleeping ${wait}s until next half-hour boundary"
          sleep "$wait"
          relay_dispatch () { # $1 = token, $2 = label
            curl -s -o /tmp/relay.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $1" \
              -H "Accept: application/vnd.github+json" \
              -H "User-Agent: pulse-relay" \
              https://api.github.com/repos/roshpinacare-sys/Pulse/dispatches \
              -d '{"event_type":"pulse","client_payload":{"note":"self-relay"}}'
          }
          code=$(relay_dispatch "$GH_TOKEN" github-token)
          if [ "$code" != "204" ]; then
            echo "relay: github.token dispatch http=${code} — falling back to FLEET_TOKEN"
            code=$(relay_dispatch "$FLEET_TOKEN" fleet-token)
          fi
          echo "relay: next tick dispatched http=${code}"
          cat /tmp/relay.out || true
          [ "$code" = "204" ] || { echo "named terminal: relay-dispatch-failed"; exit 1; }
